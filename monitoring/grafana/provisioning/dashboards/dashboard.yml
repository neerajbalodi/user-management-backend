# =============================================================
# Grafana — Dashboard Provisioning Config
# =============================================================
# Tells Grafana where to find dashboard JSON files on disk.
# =============================================================

apiVersion: 1

providers:
  - name: 'User Management Dashboards'
    orgId: 1
    folder: 'User Management'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
