# =============================================================
# Monitoring Stack — Prometheus + Grafana
# =============================================================
#
# Usage (from project root):
#   docker-compose -f monitoring/docker-compose.yml up -d
#
# Access:
#   Prometheus : http://localhost:9090
#   Grafana    : http://localhost:3000  (admin / admin)
#
# Your Spring Boot app must be running on host port 8080.
# Prometheus scrapes it at http://host.docker.internal:8080/actuator/prometheus
# =============================================================

version: '3.8'

services:

  # -----------------------------------------------------------
  # Prometheus — time-series metric store
  # -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'          # allows hot-reload via POST /-/reload
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - monitoring

  # -----------------------------------------------------------
  # Grafana — dashboards & alerting
  # -----------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitoring

# -----------------------------------------------------------
# Volumes & Networks
# -----------------------------------------------------------
volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
