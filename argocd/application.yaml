apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-management
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/neerajbalodi/user-management-backend.git
    targetRevision: main
    path: helm/user-management
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.pullPolicy
          value: Never

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
